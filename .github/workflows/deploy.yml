name: Deploy DdotsShop

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build check
        run: npm run build
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          NEXTAUTH_SECRET: ci-placeholder-secret-32chars-min
          AUTH_SECRET: ci-placeholder-secret-32chars-min
          NEXTAUTH_URL: https://app.ddotshop.com
          AUTH_URL: https://app.ddotshop.com
          AUTH_TRUST_HOST: "true"
          NEXT_PUBLIC_APP_URL: https://app.ddotshop.com
          NEXT_PUBLIC_SHOP_DOMAIN: ddotshop.com
          R2_ACCOUNT_ID: placeholder
          R2_ACCESS_KEY_ID: placeholder
          R2_SECRET_ACCESS_KEY: placeholder
          R2_BUCKET_NAME: ddotshop-assets
          R2_PUBLIC_URL: https://assets.ddotshop.com

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/ddotshop
            git pull origin master

            # Kill app container safely (AppArmor workaround)
            APP_PID=$(docker inspect --format '{{.State.Pid}}' ddotshop-app-1 2>/dev/null || echo "")
            if [ -n "$APP_PID" ] && [ "$APP_PID" != "0" ]; then
              kill -9 $APP_PID 2>/dev/null || true
              sleep 2
            fi
            docker rm -f ddotshop-app-1 2>/dev/null || true

            WORKERS_PID=$(docker inspect --format '{{.State.Pid}}' ddotshop-workers-1 2>/dev/null || echo "")
            if [ -n "$WORKERS_PID" ] && [ "$WORKERS_PID" != "0" ]; then
              kill -9 $WORKERS_PID 2>/dev/null || true
              sleep 1
            fi
            docker rm -f ddotshop-workers-1 2>/dev/null || true

            # Free port if orphaned
            fuser -k 3050/tcp 2>/dev/null || true
            sleep 2

            # Build new image
            docker compose -f docker-compose.prod.yml build --no-cache app workers

            # Start/restart all services
            docker compose -f docker-compose.prod.yml up -d postgres redis
            sleep 15
            docker compose -f docker-compose.prod.yml up -d app
            sleep 90
            docker compose -f docker-compose.prod.yml up -d workers

            # Health check
            echo "=== Container Status ==="
            docker compose -f docker-compose.prod.yml ps

            echo "=== Health Check ==="
            for i in 1 2 3; do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3050/api/health)
              echo "Attempt $i: HTTP $STATUS"
              [ "$STATUS" = "200" ] && break
              sleep 15
            done

            curl -s -o /dev/null -w "Site: HTTP %{http_code}\n" https://app.ddotshop.com
