services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ddotsshop
      POSTGRES_PASSWORD: ddotsshop
      POSTGRES_DB: ddotsshop
    volumes:
      - ddotshop_pgdata:/var/lib/postgresql/data
    networks:
      - ddotshop-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ddotsshop"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - ddotshop_redisdata:/data
    networks:
      - ddotshop-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ddotshop:latest
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: postgresql://ddotsshop:ddotsshop@postgres:5432/ddotsshop
      REDIS_URL: redis://redis:6379
      RUN_MIGRATIONS: "1"
      AUTH_TRUST_HOST: "true"
      AUTH_URL: https://app.ddotshop.com
      NEXTAUTH_URL: https://app.ddotshop.com
    ports:
      - "3050:3000"
    networks:
      - ddotshop-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  workers:
    image: ddotshop:latest
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: postgresql://ddotsshop:ddotsshop@postgres:5432/ddotsshop
      REDIS_URL: redis://redis:6379
    entrypoint: ["/bin/sh", "-c"]
    command: ["npx tsx workers/index.ts"]
    networks:
      - ddotshop-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

networks:
  ddotshop-net:
    driver: bridge

volumes:
  ddotshop_pgdata:
    name: ddotshop_pgdata
  ddotshop_redisdata:
    name: ddotshop_redisdata
